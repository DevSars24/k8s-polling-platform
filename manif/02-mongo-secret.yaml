## ------------------------------------------------------------------
## Kubernetes Secret: MongoDB Credentials
## ------------------------------------------------------------------
## Stores the MongoDB username and password in Base64-encoded form.
## Kubernetes decodes these values automatically and injects them
## into Pods that reference this Secret (see the API deployment).
##
## ⚠️  Base64 is NOT encryption — it is only encoding.
##     In production, use tools like HashiCorp Vault, AWS Secrets
##     Manager, or Sealed Secrets for real encryption.
##
## To encode your own values:
##   echo -n "myuser"    | base64   →  bXl1c2Vy
##   echo -n "mypass"    | base64   →  bXlwYXNz
## ------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: polling-platform
  labels:
    project: k8s-polling-platform
    component: database
data:
  username: YWRtaW4=        # base64 of "admin"
  password: cGFzc3dvcmQ=    # base64 of "password"
