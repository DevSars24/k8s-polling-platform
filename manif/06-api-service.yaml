## ------------------------------------------------------------------
## Kubernetes Service: API (LoadBalancer)
## ------------------------------------------------------------------
## Exposes the Go API Pods to the outside world via a cloud
## Load Balancer (e.g. AWS ELB / NLB).
##
## Traffic flow:
##   Internet → ELB (port 80) → Service → Pod (port 8080)
##
## HOW IT WORKS:
##   • "type: LoadBalancer" tells the cloud provider to provision a
##     real, internet-facing load balancer automatically.
##   • The Service round-robins traffic among all healthy API Pods.
##   • The Frontend reads the ELB's public DNS name and sends AJAX
##     requests to it.
## ------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: polling-platform
  labels:
    project: k8s-polling-platform
    component: backend
    app: api
spec:
  selector:
    role: api                         # Must match the Deployment's Pod labels
  ports:
    - protocol: TCP
      port: 80                        # External port
      targetPort: 8080                # Container port inside the Pod
  type: LoadBalancer
